services:
  inventory:
    image: ghcr.io/blagotcherecharov/devops-002-java-starter:test-blago
    container_name: inventory-service
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped